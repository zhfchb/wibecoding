# 生产环境全栈部署:app + qdrant + redis + mysql
# 使用方式:
#   1. 复制 .env.prod.example 为 .env.prod,填入真实 API key
#   2. docker compose -f docker-compose.prod.yml up -d --build
# 本地开发仍用 docker-compose.yml(Qdrant + Redis + 本地宝塔 MySQL)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wibecoding-app:latest
    container_name: wibecoding-app
    ports:
      - "8080:8080"
    env_file:
      - .env.prod
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - QDRANT_URL=http://qdrant:6333
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wibecoding-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: wibecoding-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:agent}
      MYSQL_USER: ${MYSQL_USERNAME:agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:agent123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动建表
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/init-users.sql:/docker-entrypoint-initdb.d/02-init-users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uagent", "-pagent123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wibecoding-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  mysql_data:
  redis_data:
