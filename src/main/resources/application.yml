server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: agent
    password: agent123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置(签名密钥与过期时间)
jwt:
  secret: "wibecoding-dev-secret-key-please-change-in-production-at-least-32-chars"
  expiration-ms: 86400000   # 24 小时(毫秒)

rag:
  embedding:
    # hash：本地零依赖演示，无真实语义能力；openai：接 OpenAI 兼容的真实 Embedding API（推荐硅基流动 BGE-M3）
    provider: openai
    dimension: 1024   # 与 BGE-M3 对齐，切换 provider=openai 时无需重建向量库
    model-name: BAAI/bge-m3
    # 真实 Embedding 走独立 API，不复用 DeepSeek（DeepSeek 暂无 Embedding 接口）
    base-url: https://api.siliconflow.cn/v1
    api-key: ""       # 在 application-dev.yml 覆盖；硅基流动注册 https://siliconflow.cn
  chunking:
    max-chars: 800
    overlap-chars: 100
  retrieval:
    top-k: 3
    min-score: 0.20
  vector-store:
    type: memory       # memory 开箱即跑；qdrant 需要 docker compose up -d
    qdrant-url: http://localhost:6333
    collection-name: knowledge
  # 混合检索：稠密(语义) + 稀疏(关键词 BM25 风格)，RRF 融合
  hybrid:
    enabled: true      # dev 也启用，InMemoryVectorStore/Qdrant 均支持
    recall-top-k: 20   # 召回候选数（精排前）
    rrf-k: 60          # RRF 常数 k
  # Rerank 精排：硅基流动 BGE-Reranker-v2-M3
  rerank:
    enabled: false     # 需要 api-key；无 key 时即使 true 也自动降级为 Noop
    provider: siliconflow
    base-url: https://api.siliconflow.cn/v1
    api-key: ""        # 在 application-dev.yml 覆盖；与 embedding api-key 可共用
    model-name: BAAI/bge-reranker-v2-m3
    top-k: 3           # 精排后保留数量；0 表示用 retrieval.top-k
  upload:
    max-file-size-bytes: 52428800
    allowed-extensions:
      - txt
      - md
      - markdown
      - pdf
  # 自适应 RAG（M8）：LangGraph4j 状态图，查询重写→检索→评分→重试/生成
  adaptive:
    enabled: true       # 开关；关闭时 POST /api/v1/rag/adaptive 返回 501
    max-retries: 1      # 查询重写重试次数（0=单次检索不重写）
    min-score: 0.35     # top1 检索分阈值，低于此值触发重写或兜底
  # 多 Agent 协作（M9）：检索 Agent → 生成 Agent → HITL 人工审核
  multi-agent:
    enabled: true       # 开关；关闭时 POST /api/v1/agent/multi-agent 返回 501
    max-rejects: 2      # 最多被拒绝次数，超过后强制通过（避免无限循环）
  # Web 搜索兜底：知识库无结果时 Agent 自动调用外部搜索 API
  web-search:
    enabled: false      # 需要 api-key；无 key 时自动降级为 LLM 裸回答
    provider: tavily    # 当前支持 tavily
    api-key: ""         # 在 application-dev.yml 覆盖；Tavily 注册 https://tavily.com
    max-results: 5      # 每次搜索返回几条结果
    fallback-min-score: 0.35  # 检索 top1 分数低于此值时走搜索兜底；0 表示仅在 matches 为空时触发

# springdoc / Swagger UI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method   # 接口按 HTTP 方法排序
    tags-sorter: alpha          # 分组按字母排序
  packages-to-scan: com.example.agent.controller
ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    token: ${AI_SERVICE_TOKEN:}

match:
  tasks:
    timeout-seconds: ${MATCH_TASK_TIMEOUT_SECONDS:600}
    poll-ms: 1000
    dispatch-enabled: true

resume:
  parse-tasks:
    timeout-seconds: ${RESUME_PARSE_TASK_TIMEOUT_SECONDS:600}
    poll-ms: 1000
    dispatch-enabled: true

material:
  tasks:
    timeout-seconds: ${MATERIAL_TASK_TIMEOUT_SECONDS:600}
    poll-ms: 1000
    dispatch-enabled: true
