server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: jdbc:mysql://localhost:3306/agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: agent
    password: agent123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

deepseek:
  client:
    api-key: ""   # 开发环境通过 application-dev.yml 覆盖；生产环境通过 DEEPSEEK_CLIENT_API_KEY 环境变量覆盖
    base-url: https://api.deepseek.com

# JWT 配置(签名密钥与过期时间)
jwt:
  secret: "wibecoding-dev-secret-key-please-change-in-production-at-least-32-chars"
  expiration-ms: 86400000   # 24 小时(毫秒)

rag:
  embedding:
    # hash：本地零依赖演示，无真实语义能力；openai：接 OpenAI 兼容的真实 Embedding API（推荐硅基流动 BGE-M3）
    provider: hash
    dimension: 1024   # 与 BGE-M3 对齐，切换 provider=openai 时无需重建向量库
    model-name: BAAI/bge-m3
    # 真实 Embedding 走独立 API，不复用 DeepSeek（DeepSeek 暂无 Embedding 接口）
    base-url: https://api.siliconflow.cn/v1
    api-key: ""       # 在 application-dev.yml 覆盖；硅基流动注册 https://siliconflow.cn
  chunking:
    max-chars: 800
    overlap-chars: 100
  retrieval:
    top-k: 3
    min-score: 0.20
  vector-store:
    type: memory       # memory 开箱即跑；qdrant 需要 docker compose up -d
    qdrant-url: http://localhost:6333
    collection-name: knowledge
  upload:
    max-file-size-bytes: 2097152
    allowed-extensions:
      - txt
      - md
      - markdown

# springdoc / Swagger UI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method   # 接口按 HTTP 方法排序
    tags-sorter: alpha          # 分组按字母排序
  packages-to-scan: com.example.agent.controller
