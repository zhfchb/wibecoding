# 生产环境 profile(Docker 部署用)
# 敏感配置全部走环境变量,不入仓库
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:agent}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:agent}
    password: ${MYSQL_PASSWORD:agent123}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:wibecoding-prod-secret-change-me-at-least-32-chars-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

rag:
  embedding:
    provider: ${RAG_EMBEDDING_PROVIDER:openai}
    dimension: 1024
    model-name: BAAI/bge-m3
    base-url: ${RAG_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${RAG_EMBEDDING_API_KEY}
  vector-store:
    type: ${RAG_VECTOR_STORE_TYPE:qdrant}
    qdrant-url: ${QDRANT_URL:http://qdrant:6333}
    collection-name: knowledge
  hybrid:
    enabled: ${RAG_HYBRID_ENABLED:true}
    recall-top-k: ${RAG_HYBRID_RECALL_TOP_K:20}
    rrf-k: ${RAG_HYBRID_RRF_K:60}
  rerank:
    enabled: ${RAG_RERANK_ENABLED:true}
    provider: ${RAG_RERANK_PROVIDER:siliconflow}
    base-url: ${RAG_RERANK_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${RAG_RERANK_API_KEY:${RAG_EMBEDDING_API_KEY:}}
    model-name: ${RAG_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    top-k: ${RAG_RERANK_TOP_K:3}
  upload:
    max-file-size-bytes: ${RAG_UPLOAD_MAX_BYTES:10485760}
    allowed-extensions:
      - txt
      - md
      - markdown
      - pdf
  adaptive:
    enabled: ${RAG_ADAPTIVE_ENABLED:true}
    max-retries: ${RAG_ADAPTIVE_MAX_RETRIES:1}
    min-score: ${RAG_ADAPTIVE_MIN_SCORE:0.35}
  multi-agent:
    enabled: ${RAG_MULTI_AGENT_ENABLED:true}
    max-rejects: ${RAG_MULTI_AGENT_MAX_REJECTS:2}

chat:
  session:
    store-type: redis
    ttl-seconds: 3600
    max-history: 20

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境关闭 SQL 日志
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 生产环境关闭 Swagger 的生产环境暴露(可选)
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
