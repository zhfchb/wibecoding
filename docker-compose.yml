services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: wibecoding-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # MySQL 服务已切换为本地宝塔管理的 MySQL 8.0(目录:E:\software\BtSoft\mysql\MySQL8.0)
  # 原因:本地已装 MySQL 占用 3306 端口,Docker 容器与本地服务冲突
  # 如需切回 Docker MySQL,先停掉本地 MySQL 服务,再取消下面注释并执行 docker compose up -d mysql
  # mysql:
  #   image: mysql:8.0
  #   container_name: wibecoding-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root123
  #     MYSQL_DATABASE: agent
  #     MYSQL_USER: agent
  #     MYSQL_PASSWORD: agent123
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wibecoding-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
